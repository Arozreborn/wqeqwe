name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: mvn -B package
        working-directory: TierSMP_Java
      - uses: actions/upload-artifact@v4
        with:
          name: TierSMP-jar
          path: TierSMP_Java/target/TierSMP.jar
